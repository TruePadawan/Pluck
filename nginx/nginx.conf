# Nginx Reverse Proxy Configuration for Pluck API
# This config sits in front of the Pluck API (Kestrel) and handles
# TLS termination, Rate limiting, Upload buffering and Proxy headers


# Rate Limiting Zone
# Defines a shared memory zone called "downloads" (10 MB) that tracks client IPs.
# Each IP is allowed 5 requests/second to any endpoint matching the /f/ path.
# This prevents a single client from hammering the download endpoint.
# "binary_remote_addr" is used instead of "remote_addr" because it uses less memory.
limit_req_zone $binary_remote_addr zone=downloads:10m rate=5r/s;

events {
    # Maximum simultaneous connections each worker process can handle.
    # 1024 is a sensible default for a self-hosted service.
    worker_connections 1024;
}

http {
    # Timeouts for large file transfers
    # Pluck supports uploads up to 10GB, so we need generous timeouts.
    # These prevent Nginx from closing the connection mid-transfer
    # on slow networks.

    # Time Nginx waits to *send* a chunk to the client (download direction).
    send_timeout 600s;

    # Time Nginx waits to *read* a chunk from the client (upload direction).
    client_body_timeout 600s;

    # Time Nginx waits to read the full request headers from the client.
    # Headers are small, so 30s is plenty.
    client_header_timeout 30s;

    # Time Nginx waits for the upstream (Pluck API) to send a response.
    proxy_read_timeout 600s;

    # Time Nginx waits for the upstream to accept a forwarded request.
    proxy_send_timeout 600s;

    # Time Nginx waits to establish a TCP connection to the upstream.
    proxy_connect_timeout 30s;

    # Upload buffering
    # Maximum allowed size of the client request body (i.e., the uploaded file).
    # Must be >= the Pluck API's Kestrel limit (10GB).
    client_max_body_size 10G;

    # Directory where Nginx temporarily stores request bodies that exceed
    # the in-memory buffer. Without this, a 10GB upload would need 10GB of RAM.
    client_body_temp_path /tmp/nginx_uploads;

    # Size of the in-memory buffer for the request body before spilling to disk.
    # 10MB is a good balance — small uploads stay in memory, large ones go to disk.
    client_body_buffer_size 10m;

    # Redirect HTTP to HTTPS
    # Any request on port 80 gets a 301 redirect to the HTTPS version.
    # This ensures no one accidentally sends credentials over plaintext.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS Server
    server {
        listen 443 ssl;
        server_name _;

        # TLS Certificate Paths
        # These point to the volume-mounted certificate files.
        # Replace with your own certs (e.g., from Let's Encrypt / certbot).
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # TLS Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;

        # Let the server choose the cipher suite, not the client.
        # This prevents downgrade attacks where a client requests a weak cipher.
        ssl_prefer_server_ciphers on;

        # Recommended cipher list — prioritizes modern AEAD ciphers.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Download Endpoint (rate-limited)
        # Applies the rate limit defined above to the /f/ path (public downloads).
        location /f/ {
            limit_req zone=downloads burst=10 nodelay;

            proxy_pass http://pluck.api:8080;

            # Forward the real client IP to the app (not Nginx's internal IP).
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Tell the app that the original request was HTTPS,
            # even though Nginx forwards it over plain HTTP internally.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable response buffering for file downloads — stream directly
            # from the API to the client without Nginx caching it in memory/disk.
            proxy_buffering off;
        }

        # All Other Endpoints (API, admin, etc.)
        location / {
            proxy_pass http://pluck.api:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # For upload requests: don't buffer the request body in Nginx's
            # memory — stream it directly to the Pluck API. This avoids Nginx
            # trying to hold a 10GB file in RAM before forwarding it.
            proxy_request_buffering off;
        }
    }
}
