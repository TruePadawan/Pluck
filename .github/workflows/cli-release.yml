name: Publish CLI Binaries

on:
  push:
    tags:
      - 'cli-v*'

jobs:
  release-cli:
    name: Build and Release CLI Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract Tag Version
        id: get_version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${RAW_TAG#cli-}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Binaries
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist

          # Linux x64
          dotnet publish src/Pluck.Cli/Pluck.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux-x64
          mv ./publish/linux-x64/Pluck.Cli ./dist/pluck-${VERSION}-linux-x64

          # Windows x64
          dotnet publish src/Pluck.Cli/Pluck.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/win-x64
          mv ./publish/win-x64/Pluck.Cli.exe ./dist/pluck-${VERSION}-win-x64.exe

          # macOS ARM64 (Apple Silicon)
          dotnet publish src/Pluck.Cli/Pluck.Cli.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o ./publish/osx-arm64
          mv ./publish/osx-arm64/Pluck.Cli ./dist/pluck-${VERSION}-osx-arm64

          # macOS x64 (Intel)
          dotnet publish src/Pluck.Cli/Pluck.Cli.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/osx-x64
          mv ./publish/osx-x64/Pluck.Cli ./dist/pluck-${VERSION}-osx-x64

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: CLI Release ${{ steps.get_version.outputs.VERSION }}
          files: ./dist/*
          draft: false
          prerelease: false


  publish-chocolatey:
    name: Publish to Chocolatey
    needs: release-cli
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          $version = $rawTag -replace '^cli-v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          $tagVersion = $rawTag -replace '^cli-', ''
          echo "TAG_VERSION=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Compute installer checksum
        id: checksum
        shell: pwsh
        run: |
          $tagVersion = "${{ steps.get_version.outputs.TAG_VERSION }}"
          $url = "https://github.com/TruePadawan/Pluck/releases/download/cli-${tagVersion}/pluck-${tagVersion}-win-x64.exe"
          Invoke-WebRequest $url -OutFile pluck.exe
          $hash = (Get-FileHash pluck.exe -Algorithm SHA256).Hash
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          Remove-Item pluck.exe

      - name: Pack and Push Chocolatey package
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $checksum = "${{ steps.checksum.outputs.SHA256 }}"

          # Stamp version into nuspec
          $nuspecPath = "choco/pluck.nuspec"
          (Get-Content $nuspecPath) -replace '<version>.*</version>', "<version>$version</version>" | Set-Content $nuspecPath

          # Stamp checksum into install script
          $installScript = "choco/tools/chocolateyinstall.ps1"
          (Get-Content $installScript) -replace '__CHECKSUM__', $checksum | Set-Content $installScript

          # Pack
          choco pack $nuspecPath --output-directory choco

          # Push
          $nupkg = Get-ChildItem choco/*.nupkg | Select-Object -First 1
          choco push $nupkg.FullName --api-key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/
